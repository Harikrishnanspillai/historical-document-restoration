name: HistoricalNoise_Restormer
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  train:
    name: HistoricalNoiseTrain
    type: PairedImageDataset

    dataroot_gt: ../../../data/noise/train/clean
    dataroot_lq: ../../../data/noise/train/degraded

    phase: train
    gt_size: 128
    batch_size_per_gpu: 2
    num_worker_per_gpu: 0

    use_augmentation: true
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: HistoricalNoiseVal
    type: PairedImageDataset

    dataroot_gt: ../../../data/noise/val/clean
    dataroot_lq: ../../../data/noise/val/degraded

    phase: val
    use_augmentation: false

    io_backend:
      type: disk

network_g:
  type: Restormer
  inp_channels: 1
  out_channels: 1

  dim: 24
  num_blocks: [2, 2, 2, 4]
  num_refinement_blocks: 2
  heads: [1, 2, 4, 8]

  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 5000
  warmup_iter: -1

  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [5000]
    restart_weights: [1]
    eta_mins: [0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: false

  optim_g:
    type: AdamW
    lr: 0.0002
    weight_decay: 0.0001
    betas: [0.9, 0.999]

  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

val:
  window_size: 8
  val_freq: 500
  save_img: false
  rgb2bgr: false
  use_image: false

logger:
  print_freq: 100
  save_checkpoint_freq: 500
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: gloo
  port: 29500